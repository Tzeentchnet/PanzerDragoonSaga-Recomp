name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core - ${{ matrix.configuration }}
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
          - Shipping

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install current CMake and Ninja
        run: python -m pip install --disable-pip-version-check cmake==4.4.4 ninja==1.13.2

      - name: Build and test
        shell: cmd
        run: windows-build.bat ${{ matrix.configuration }}

  address-sanitizer:
    name: Diagnostic - AddressSanitizer
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install current CMake and Ninja
        run: python -m pip install --disable-pip-version-check cmake==4.4.4 ninja==1.13.2

      - name: Build and test
        shell: cmd
        run: windows-build.bat Asan
