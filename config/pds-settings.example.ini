; Panzer Dragoon Saga configuration version 1.
; The launcher writes the active user copy to:
; %LOCALAPPDATA%\PanzerDragoonSaga-Recomp\settings.ini

[config]
version=1

[launcher]
build=Release

[graphics]
renderer=auto
window_width=1280
window_height=960
fullscreen=false
vsync=false

[audio_pacing]
volume_percent=100
frame_limit=30

[input.keyboard]
a=C
b=X
c=Z
start=Return
up=Up
down=Down
left=Left
right=Right
x=A
y=S
l=Q
r=W

[input.gamepad]
south=a
east=b
west=x
north=c
back=none
start=start
left_stick=none
right_stick=none
left_shoulder=l
right_shoulder=r
dpad_up=up
dpad_down=down
dpad_left=left
dpad_right=right
left_trigger=l
right_trigger=r
left_stick_directions=true

[experimental]
gpu_vdp1=true
combined_dual_plane=true
smooth_gouraud=true
direct_ray_rendering=true
